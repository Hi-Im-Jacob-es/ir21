<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partnerzy roamingowi</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <h1>Partnerzy roamingowi</h1>
  <p class="podtytul">Frontend do API <code>/api/partners</code></p>

  <p id="komunikat"></p>

  <section class="karta">
    <h2>Dodaj partnera</h2>
    <form id="formularz">
      <label>Nazwa
        <input id="nazwa" required placeholder="np. Vodafone DE">
      </label>
      <label>MCC-MNC
        <input id="mccMnc" required pattern="\d{5,6}" title="5 lub 6 cyfr" placeholder="np. 26202">
      </label>
      <button type="submit" class="glowny">Dodaj</button>
    </form>
  </section>

  <section class="karta">
    <h2>Lista partnerów</h2>
    <table>
      <thead>
        <tr><th>ID</th><th>Nazwa</th><th>MCC-MNC</th><th></th></tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </section>

  <section class="karta">
    <h2>Zapytania do backendu</h2>
    <ul id="log"></ul>
  </section>

</main>

  <script src="js/script.js"></script>
</body>
</html>
